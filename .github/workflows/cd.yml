name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  # A newer push waits instead of cancelling a deploy that is already running. Only one run
  # waits (queue: single): a push that arrives meanwhile replaces it. Each run deploys its own
  # SHA, so the newest push is the one that ends up on the VM.
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    # Runs deploy/deploy.sh on the OCI VM over SSH; it fails the job if the health check fails.
    # The `production` environment holds the secrets and limits which branches can read them.
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
      OCI_TARGET: ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
      - name: Deploy the commit CI checked
        run: |
          set -o pipefail
          # The key's forced command on the VM reads this SHA from SSH_ORIGINAL_COMMAND (runbook §14).
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$OCI_TARGET" "$DEPLOY_SHA" | tee deploy.log
          # A VM still on the old forced command ignores the SHA and deploys the tip of main.
          grep -q "^deploying .* ($DEPLOY_SHA)$" deploy.log
